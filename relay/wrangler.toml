name = "mapbattle-relay"
main = "worker.js"
compatibility_date = "2025-10-01"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "RelayRoom"

# Workers Logs: keeps console.log output (searchable in the dashboard, Workers & Pages → mapbattle-relay → Logs).
# The room logs lobby events and one stats line per 30 s, never per message, to stay inside the free allowance.
[observability]
enabled = true
head_sampling_rate = 1

# SQLite-backed Durable Objects are the kind the Workers free plan offers.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]
